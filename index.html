<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spoke 'n Word</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header>
        <h1>Spoke 'n Word</h1>
        <p class="tagline">Seattle's Bike Event Hub</p>
        <a href="https://docs.google.com/forms/d/1RKm1U2Yxw-caiE75aEqWunGBRUsiPu7DSvT2B4Bp9HY/viewform" target="_blank" class="submit-btn">Submit Your Event</a>
    </header>

    <!-- FILTER SECTION -->
    <section id="filters" class="filters">
        <input id="filter-search" class="filter-input" placeholder="Search events…" />
        <input id="filter-date" class="filter-input" type="date" />
        <input id="filter-time" class="filter-input" type="time" />
        <input id="filter-location" class="filter-input" placeholder="Filter by location…" />
        <input id="filter-host" class="filter-input" placeholder="Filter by host…" />
        <input id="filter-tags" class="filter-input" placeholder="Filter by tag…" />
    </section>

    <!-- EVENT TABLE -->
    <section id="eventList" class="event-list">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Name</th>
                    <th>Location</th>
                    <th>Host</th>
                    <th>Description</th>
                    <th>Tags</th>
                    <th>Link</th>
                </tr>
            </thead>
            <tbody id="event-table-body"></tbody>
        </table>
    </section>

    <script src="script.js"></script>
</body>
</html>
